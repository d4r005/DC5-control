# Red de seguridad de pagos: Mercado Pago no garantiza la entrega de su
# webhook (falla de forma intermitente — comportamiento documentado del
# proveedor, no un bug de este código). Este workflow llama cada 10 min
# al endpoint /api/payments/reconcile, que revisa las órdenes "pending"
# recientes, verifica contra la API real de MP si en realidad SÍ se
# pagaron, y si es así las acredita (mismo flujo idempotente del
# webhook: vuelve a verificar contra MP y usa el RPC process_payment_webhook).
# Cloudflare Pages Functions no soporta Cron Triggers nativos (solo los
# Workers dedicados los soportan) — por eso el disparador vive aquí.
name: Reconciliar pagos pendientes (Mercado Pago)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/payments/reconcile
        run: |
          resp=$(curl -s -w "\n%{http_code}" -H "x-api-key: ${{ secrets.RECONCILE_API_KEY }}" "https://ace-control.online/api/payments/reconcile")
          body=$(echo "$resp" | head -n -1)
          code=$(echo "$resp" | tail -n 1)
          echo "HTTP $code :: $body"
          if [ "$code" != "200" ]; then
            echo "::error::Reconcile falló con código $code"
            exit 1
          fi
