name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DC5-control-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish rolling "latest" release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Última APK (auto-build)
          body: |
            APK generada automáticamente desde el commit ${{ github.sha }} en main.
            Descarga `app-debug.apk` de abajo e instálala en tu teléfono (permite "orígenes desconocidos" si Android lo pide).
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: false
